<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="CareerBot — AI-powered career guidance chatbot for B.Tech CSE students. Get roadmaps, placement tips, and expert advice." />
  <meta name="keywords" content="B.Tech CSE, career guidance, chatbot, AI, placement, internship, Web Development, Data Science, AI ML" />
  <title>CareerBot — B.Tech CSE Career Guide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ───────────── Sidebar ───────────── -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <span class="logo-icon">🤖</span>
        <span class="logo-text">CareerBot</span>
      </div>
      <button class="new-chat-btn" id="newChatBtn" title="New Chat">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New Chat
      </button>
    </div>

    <nav class="sidebar-nav">
      <p class="nav-label">Quick Topics</p>
      <ul class="topic-list">
        <li><button class="topic-btn" data-prompt="Give me a complete Web Development roadmap for a B.Tech CSE student starting from scratch.">🌐 Web Dev Roadmap</button></li>
        <li><button class="topic-btn" data-prompt="Give me a complete Data Science roadmap with skills and tools I need to learn.">📊 Data Science Roadmap</button></li>
        <li><button class="topic-btn" data-prompt="How to start learning AI and Machine Learning as a B.Tech CSE student? Give me a structured plan.">🧠 AI / ML Roadmap</button></li>
        <li><button class="topic-btn" data-prompt="Give me a Cybersecurity career roadmap for B.Tech CSE students.">🔐 Cybersecurity Roadmap</button></li>
        <li><button class="topic-btn" data-prompt="What is the roadmap to become a Software Engineer at top product companies?">💻 Software Engineering</button></li>
        <li><button class="topic-btn" data-prompt="How to start learning DSA (Data Structures and Algorithms)? Give me a step-by-step plan.">🧩 How to Start DSA</button></li>
        <li><button class="topic-btn" data-prompt="Give me a complete placement preparation plan for B.Tech CSE students including DSA, system design, and HR rounds.">🎯 Placement Prep Tips</button></li>
        <li><button class="topic-btn" data-prompt="How do I get my first internship as a B.Tech CSE student? What skills should I build?">💼 Get First Internship</button></li>
        <li><button class="topic-btn" data-prompt="What are some impressive project ideas for B.Tech CSE students to add to a portfolio?">🚀 Project Ideas</button></li>
        <li><button class="topic-btn" data-prompt="Which programming language should I learn first as a B.Tech CSE student and why?">⚡ Best First Language</button></li>
      </ul>
    </nav>

    <div class="sidebar-footer">
      <button class="clear-btn" id="clearChatBtn" title="Clear all chat history">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
        Clear History
      </button>
      <p class="version-tag">v1.0 · Powered by Gemini</p>
    </div>
  </aside>

  <!-- ───────────── Main Content ───────────── -->
  <main class="main-content">

    <!-- Top Header Bar -->
    <header class="top-bar">
      <button class="menu-toggle" id="menuToggle" aria-label="Toggle sidebar">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="top-bar-title">
        <span class="status-dot" id="statusDot"></span>
        <span id="connectionStatus">Connecting…</span>
      </div>
      <div class="top-bar-right">
        <span class="badge">B.Tech CSE Guide</span>
      </div>
    </header>

    <!-- Chat Area -->
    <section class="chat-area" id="chatArea">

      <!-- Welcome Screen (shown when no messages) -->
      <div class="welcome-screen" id="welcomeScreen">
        <div class="welcome-glow"></div>
        <div class="welcome-avatar">🤖</div>
        <h1 class="welcome-title">Hi, I'm <span class="gradient-text">CareerBot</span></h1>
        <p class="welcome-subtitle">Your AI-powered career mentor for B.Tech CSE students.<br/>Ask me anything about career paths, roadmaps, and placements.</p>

        <div class="suggestion-grid" id="suggestionGrid">
          <button class="suggestion-card" data-prompt="Which field should I choose after B.Tech CSE — Web Dev, AI/ML, or Data Science?">
            <span class="suggestion-icon">🤔</span>
            <span class="suggestion-text">Which field should I choose after B.Tech?</span>
          </button>
          <button class="suggestion-card" data-prompt="Give me a complete Web Development roadmap for a B.Tech CSE student starting from scratch.">
            <span class="suggestion-icon">🌐</span>
            <span class="suggestion-text">Web Development Roadmap</span>
          </button>
          <button class="suggestion-card" data-prompt="How to start learning DSA (Data Structures and Algorithms)? Give me a step-by-step plan.">
            <span class="suggestion-icon">🧩</span>
            <span class="suggestion-text">How to start DSA</span>
          </button>
          <button class="suggestion-card" data-prompt="Give me a complete placement preparation plan for B.Tech CSE students including DSA, system design, and HR rounds.">
            <span class="suggestion-icon">🎯</span>
            <span class="suggestion-text">Placement preparation tips</span>
          </button>
          <button class="suggestion-card" data-prompt="Give me a complete Data Science roadmap with skills, tools, and learning resources.">
            <span class="suggestion-icon">📊</span>
            <span class="suggestion-text">Data Science Roadmap</span>
          </button>
          <button class="suggestion-card" data-prompt="How to get a software engineering internship as a 2nd or 3rd year B.Tech CSE student?">
            <span class="suggestion-icon">💼</span>
            <span class="suggestion-text">How to get an internship</span>
          </button>
        </div>
      </div>

      <!-- Messages Container -->
      <div class="messages-container" id="messagesContainer"></div>

    </section>

    <!-- Input Area -->
    <footer class="input-area">
      <div class="input-wrapper">
        <textarea
          id="userInput"
          class="message-input"
          placeholder="Ask me about career paths, roadmaps, DSA, placements…"
          rows="1"
          maxlength="2000"
          aria-label="Type your message"
        ></textarea>
        <button class="send-btn" id="sendBtn" aria-label="Send message" disabled>
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
      <p class="input-footer-text">CareerBot can make mistakes. Verify important info from official sources.</p>
    </footer>

  </main>

  <!-- Overlay for mobile sidebar -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- Toast Notification -->
  <div class="toast" id="toast"></div>

  <script src="script.js"></script>
</body>
</html>
